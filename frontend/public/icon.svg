<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <style>
    .on-dark { display: none; }
    @media (prefers-color-scheme: dark) { .on-light { display: none; } .on-dark { display: inline; } }
  </style>
  <image class="on-light" width="128" height="128" href="data:image/png;base64,"/>
  <image class="on-dark" width="128" height="128" href="data:image/png;base64,"/>
</svg>
