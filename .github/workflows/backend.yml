# Backend pipeline: test -> build images -> push to ECR -> deploy on EC2 (Docker Compose).
# Pull requests run the tests and build the images without pushing. A push to main also deploys.
# AWS access is GitHub OIDC (no keys in the repo); the EC2 host is reached with SSM Run Command
# (no SSH port open). One-time setup: backend/deploy/README.md.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION            e.g. ap-south-1
#   AWS_DEPLOY_ROLE_ARN   the role GitHub assumes (backend/deploy/iam/)
#   EC2_INSTANCE_ID       e.g. i-0123456789abcdef0
#   DOCKER_PLATFORM       optional: linux/amd64 (default) or linux/arm64 (Graviton instance)
#   EC2_USER, EC2_REPO_DIR  optional: default ec2-user and /home/ec2-user/Vaari
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "data/**", ".dockerignore", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "data/**", ".dockerignore", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/engine/uv.lock
      - run: npm ci
      - run: npm run typecheck
      - run: npm run engine:setup
      - run: npm run test:engine
      - run: npm run test:api

  images:
    name: Build images
    needs: test
    runs-on: ${{ vars.DOCKER_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: AWS credentials (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in to ECR
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}/vaari-api:{1}', steps.ecr.outputs.registry, github.sha) || 'vaari-api:ci' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false
      - name: Engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/engine/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}/vaari-engine:{1}', steps.ecr.outputs.registry, github.sha) || 'vaari-engine:ci' }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
          provenance: false

  deploy:
    name: Deploy to EC2
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run deploy/deploy.sh on the instance (SSM)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
          REPO_DIR: ${{ vars.EC2_REPO_DIR || '/home/ec2-user/Vaari' }}
          REGISTRY: ${{ needs.images.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The host's checkout moves to this commit (fast-forward only: a diverged host stops the
          # deploy instead of losing its changes), so docker-compose.yml matches the images.
          script="cd '$REPO_DIR' && git fetch --quiet origin main && git merge --ff-only --quiet '$SHA' && IMAGE_REGISTRY='$REGISTRY' backend/deploy/deploy.sh '$SHA'"
          parameters="$(jq -n --arg user "$EC2_USER" --arg script "$script" \
            '{commands: ["runuser -l \($user) -c \($script | @sh)"], executionTimeout: ["1200"]}')"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "vaari backend ${SHA:0:7}" --parameters "$parameters" --query Command.CommandId --output text)"
          echo "SSM command $command_id"
          status=Pending
          for _ in $(seq 1 240); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending | InProgress | Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "status: $status"
          [ "$status" = Success ]
