[project]
name = "vaari-engine"
version = "0.1.0"
description = "Vaari scheduling engine: CP-SAT assignment, exact routes, solver-derived explanations, season simulator. No AWS imports."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ortools>=9.12",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaari_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
